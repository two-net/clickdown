[package]
name = "clickdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "signal"] }
toml = { version = "1.1.5", default-features = false, features = ["std", "parse", "serde"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints.rust]
unsafe_code = "forbid"
